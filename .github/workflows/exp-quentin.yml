name: exp-quentin
on:
  push:
    branches: [ccr-f9524063-8rcf8a]
    paths: [quentin/exp_request.txt]
defaults:
  run:
    working-directory: quentin
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - {name: swangle2, gl: swangle, c: 2}
          - {name: swangle4, gl: swangle, c: 4}
          - {name: angle2, gl: angle, c: 2}
          - {name: angle-egl3, gl: angle-egl, c: 3}
          - {name: default3, gl: '', c: 3}
          - {name: swangle1, gl: swangle, c: 1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 >/dev/null
      - run: npm ci --no-audit --no-fund
      - name: render 150 frames
        run: |
          mkdir -p out
          GL=""; [ -n "${{ matrix.cfg.gl }}" ] && GL="--gl=${{ matrix.cfg.gl }}"
          START=$(date +%s)
          npx remotion render Long out/t.mp4 --frames=0-149 --muted $GL --concurrency=${{ matrix.cfg.c }} --crf=18 --log=info --timeout=60000 2>&1 | grep -v "Rendered [0-9]*/" | tail -30
          echo "RESULT ${{ matrix.cfg.name }} took $(( $(date +%s) - START )) s"
          ls -la out/t.mp4
