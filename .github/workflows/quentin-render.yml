name: quentin-chef-render
on:
  push:
    branches: [ccr-2fba6931-329mzu]
    paths: ['quentin/**', '.github/workflows/quentin-render.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quentin-render
  cancel-in-progress: true
env:
  CHUNK: 600
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.c.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        working-directory: quentin
        run: |
          echo "chunks=$(node -e "const t=require('./src/story/timeline.json').total;const n=Math.ceil(t/$CHUNK);console.log(JSON.stringify([...Array(n).keys()]))")" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    defaults:
      run:
        working-directory: quentin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: browser
        run: npx remotion browser ensure
      - name: sound bed (needed by the composition)
        run: mkdir -p public/sfx && node tools/build-sound.mjs && node tools/make-sound.mjs
      - name: render chunk (30-frame pieces, fresh browser each, 720p)
        run: |
          mkdir -p out/chunks_Long out/sub
          TOTAL=$(node -e "console.log(require('./src/story/timeline.json').total)")
          S=$(( ${{ matrix.chunk }} * CHUNK ))
          E=$(( S + CHUNK - 1 )); if [ $E -ge $TOTAL ]; then E=$(( TOTAL - 1 )); fi
          N=$(printf '%02d' ${{ matrix.chunk }})
          FF=$(ls node_modules/@remotion/compositor-*/ffmpeg | head -1); chmod +x "$FF" || true
          echo "frames $S-$E"
          : > out/sub/list.txt
          K=0
          for (( A=S; A<=E; A+=30 )); do
            B=$(( A + 29 )); if [ $B -gt $E ]; then B=$E; fi
            F=out/sub/s$(printf '%02d' $K).mp4
            OK=0
            for try in 1 2 3; do
              if npx remotion render Long $F --frames=$A-$B --muted --gl=swangle --concurrency=2 --scale=0.6667 --crf=17 --log=error --timeout=240000; then OK=1; break; fi
              echo "retry $try for $A-$B"; sleep 3
            done
            if [ $OK -ne 1 ]; then echo "CHUNK FAILED at $A-$B"; exit 1; fi
            echo "file 's$(printf '%02d' $K).mp4'" >> out/sub/list.txt
            K=$(( K + 1 ))
          done
          "$FF" -hide_banner -v error -y -f concat -safe 0 -i out/sub/list.txt -c copy out/chunks_Long/c$N.mp4
          ls -la out/chunks_Long
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: quentin/out/chunks_Long/c*.mp4
          retention-days: 3
          compression-level: 0
  join:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: quentin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: quentin/out/chunks_Long
          merge-multiple: true
      - name: sound, join, loudness
        run: |
          mkdir -p public/sfx && node tools/build-sound.mjs && node tools/make-sound.mjs
          ls out/chunks_Long
          node tools/render.mjs Long --chunk $CHUNK
          node tools/check-video.mjs out/Long.mp4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: Quentin_chef_video
          path: quentin/out/Long.mp4
          retention-days: 30
          compression-level: 0
      - name: publish as a GitHub release (easy download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/Long.mp4 Quentin_chef.mp4
          gh release create "quentin-chef-${{ github.run_number }}" Quentin_chef.mp4 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Quentin chef video (run ${{ github.run_number }})" --notes "Rendered by GitHub Actions" || true
