name: render-mars
# Рендер видео "Mars: Earth is gone" (Remotion). Запуск: пуш изменённого mars/render_request.txt
# (первое слово: "test" — 3 секунды для проверки, "full" — всё видео) или вручную (workflow_dispatch).
on:
  push:
    branches: [ccr-2f044125-0iu1tt]
    paths: [mars/render_request.txt]
  workflow_dispatch:
    inputs:
      mode:
        description: "test или full"
        default: full
permissions:
  contents: write
concurrency:
  group: render-mars
  cancel-in-progress: true
env:
  CHUNK: 600
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      mode: ${{ steps.p.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        working-directory: mars
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          total = json.load(open('src/story/timeline.json'))['total']
          mode = os.environ.get('INPUT_MODE') or open('render_request.txt').read().split()[0]
          chunk = int(os.environ['CHUNK'])
          out, s, i = [], 0, 0
          while s < total:
              out.append({"i": i, "from": s, "to": min(total - 1, s + chunk - 1)})
              s += chunk; i += 1
          if mode == 'test':
              out = [{"i": 0, "from": 3000, "to": 3089}]
          print("mode=" + mode)
          print("chunks=" + json.dumps(out))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mars/package-lock.json
      - name: browser libs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64 > /dev/null
      - name: npm ci
        working-directory: mars
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npx remotion browser ensure
      - name: render chunk ${{ matrix.chunk.i }} (frames ${{ matrix.chunk.from }}-${{ matrix.chunk.to }})
        working-directory: mars
        run: |
          mkdir -p out
          ok=0
          for try in 1 2 3; do
            conc=$((5 - try))
            [ $conc -gt 4 ] && conc=4
            if npx remotion render Long out/chunk.mp4 --frames=${{ matrix.chunk.from }}-${{ matrix.chunk.to }} --muted --gl=angle --concurrency=$conc --crf=18 --log=error --timeout=240000; then ok=1; break; fi
            echo "retry $try"
          done
          [ "$ok" = 1 ]
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.i }}
          path: mars/out/chunk.mp4
          retention-days: 3
          compression-level: 0
  assemble:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mars/package-lock.json
      - name: npm ci
        working-directory: mars
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: mars/out/chunks
      - name: sound + mux
        working-directory: mars
        run: |
          set -e
          chmod +x node_modules/@remotion/compositor-*/* || true
          node tools/make-sound.mjs
          FF=$(ls node_modules/@remotion/compositor-*/ffmpeg | head -1)
          python3 - <<'PY'
          import os
          d = 'out/chunks'
          names = sorted(os.listdir(d), key=lambda n: int(n.split('-')[1]))
          open('out/list.txt', 'w').write('\n'.join(f"file 'chunks/{n}/chunk.mp4'" for n in names))
          print(names)
          PY
          $FF -hide_banner -v error -y -f concat -safe 0 -i out/list.txt -c copy out/silent.mp4
          node tools/mix-audio.mjs src/story/timeline.json public/sfx/bed.wav 1 out/mix.wav
          node tools/loudness.mjs out/mix.wav out/silent.mp4 out/Mars.mp4 -16
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Mars-video
          path: mars/out/Mars.mp4
          retention-days: 14
          compression-level: 0
      - name: release
        if: needs.plan.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mars-${{ github.run_number }}" mars/out/Mars.mp4 --title "Mars: Earth is gone (render #${{ github.run_number }})" --notes "Готовый ролик, 1920x1080, 30 fps, звук -16 LUFS."
