name: render-hospital
# Renders the "St. Brendan's" Remotion video on GitHub: picture in parallel chunks,
# then one job joins the chunks, builds the sound (voice + ambience + SFX), normalises
# loudness to -16 LUFS and publishes the MP4 as a release asset + artifact.
on:
  push:
    branches: [ccr-eaede815-oxz1br]
    paths: [hospital/render_request.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-hospital
  cancel-in-progress: true
env:
  CHUNK: 300
defaults:
  run:
    working-directory: hospital
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.c.outputs.chunks }}
      total: ${{ steps.c.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          node -e "
          const t=require('./src/story/timeline.json').total;
          const n=Math.ceil(t/${CHUNK});
          console.log('total',t,'chunks',n);
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'total='+t+'\nchunks='+JSON.stringify([...Array(n).keys()])+'\n');
          "
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hospital/package-lock.json
      - name: system libs for headless Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 >/dev/null || true
      - run: npm ci
      - name: render chunk ${{ matrix.chunk }}
        run: |
          S=$(( ${{ matrix.chunk }} * CHUNK ))
          E=$(( S + CHUNK - 1 ))
          T=${{ needs.plan.outputs.total }}
          if [ "$E" -ge "$T" ]; then E=$(( T - 1 )); fi
          mkdir -p out
          OUT=out/c$(printf '%02d' ${{ matrix.chunk }}).mp4
          for try in 1 2 3; do
            C=2; [ "$try" -gt 1 ] && C=1
            npx remotion render Long $OUT --frames=$S-$E --muted --gl=swangle --concurrency=$C --crf=18 --log=error --timeout=400000 && break
            echo "retry $try with fewer tabs"
          done
          ls -la out
          test -s $OUT
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: hospital/out/c*.mp4
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  assemble:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hospital/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: hospital/dl
          merge-multiple: true
      - name: join picture
        run: |
          ls dl | wc -l
          mkdir -p out
          (cd dl && for f in $(ls c*.mp4 | sort); do echo "file '$f'"; done > list.txt; cat list.txt | wc -l)
          FF=$(ls node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg)
          chmod +x node_modules/@remotion/compositor-linux-x64-gnu/* || true
          node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg -hide_banner -v error -y -f concat -safe 0 -i dl/list.txt -c copy out/video.mp4
          ls -la out
      - name: sound
        run: |
          node tools/make-sound.mjs
          node tools/mix-audio.mjs src/story/timeline.json public/sfx/bed.wav 1 out/mix.wav
          node tools/loudness.mjs out/mix.wav out/video.mp4 out/St_Brendans_final.mp4 -16
          ls -la out
      - name: probe
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of default=nw=1 out/St_Brendans_final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: St_Brendans_final
          path: hospital/out/St_Brendans_final.mp4
          retention-days: 30
          compression-level: 0
      - name: publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hospital-${{ github.run_number }}"
          gh release create "$TAG" out/St_Brendans_final.mp4 --title "St. Brendan's — render #${{ github.run_number }}" --notes "Rendered on GitHub Actions" --target "${{ github.sha }}" || gh release upload "$TAG" out/St_Brendans_final.mp4 --clobber
