name: join-quentin
on:
  push:
    branches: [ccr-f9524063-8rcf8a]
    paths: [quentin/final/**]
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: join parts
        run: |
          cat quentin/final/Long.mp4.part* > Long.mp4
          ls -la Long.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 Long.mp4 || true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "quentin-final-${{ github.run_number }}" Long.mp4 --title "Quentin: A \$100 bill for every scary truth (full 1080p)" --notes "Full 13:15 1080p render, not recompressed" --target "${{ github.sha }}"
