name: render-story
on:
  push:
    branches: [claude/roblox-story-kit-video-z45tlv]
    paths: [render_request.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-story
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.c.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: echo "chunks=$(python3 -c "import json;print(json.dumps(list(range(len(json.load(open('studio/videos/story/chunks.json')))))))")" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - name: system libs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libxfixes3 libsm6 libice6 libgles2 libegl-mesa0 >/dev/null
      - name: blender
        run: |
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          tar xf b.tar.xz && mv blender-5.2.0-linux-x64 "$HOME/blender" && rm b.tar.xz
          mkdir -p ~/.fonts && cp studio/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null || true
      - name: render chunk
        run: |
          cd studio
          echo "{\"blender\": \"$HOME/blender/blender\"}" > config.json
          IDS=$(python3 -c "import json;print(json.load(open('videos/story/chunks.json'))[${{ matrix.chunk }}])")
          echo "shots: $IDS"
          FINAL_PCT=50 python3 tools/blend.py story final "$IDS" 5 | tee render_${{ matrix.chunk }}.log
          echo "frames: $(ls videos/story/frames | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk }}
          path: |
            studio/videos/story/frames/*.png
            studio/render_${{ matrix.chunk }}.log
          retention-days: 3
          compression-level: 0
  assemble:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: dl
          merge-multiple: true
      - name: encode + commit
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p renders
          ls dl/videos/story/frames | wc -l
          cat dl/render_*.log | grep -E "ok|FAILED" > renders/render_log.txt || true
          python3 - <<'PY'
          import os
          have={int(f[:4]) for f in os.listdir('dl/videos/story/frames')}
          mx=max(have); miss=[i for i in range(1,mx+1) if i not in have]
          open('renders/missing.txt','w').write(f"max {mx}\nmissing {len(miss)}: {miss[:200]}\n")
          print(open('renders/missing.txt').read())
          PY
          ffmpeg -v error -y -framerate 30 -i dl/videos/story/frames/%04d.png -c:v libx264 -preset slow -crf 9 -pix_fmt yuv444p renders/story_frames.mkv
          ls -la renders
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add renders
          git commit -m "Rendered frames for story (540x960, lossless-ish)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
