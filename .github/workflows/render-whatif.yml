name: render-whatif-video
on:
  push:
    branches: [ccr-b072611f-0payso]
    paths: [video/render_request.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-whatif
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.c.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          total = json.load(open('video/src/story/timeline.json'))['total']
          chunk = 240
          out, s, i = [], 0, 0
          while s < total:
              out.append({"i": i, "from": s, "to": min(total - 1, s + chunk - 1)})
              s += chunk; i += 1
          print("chunks=" + json.dumps(out))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: browser libs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2t64 > /dev/null
      - name: npm ci
        working-directory: video
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npx remotion browser ensure
      - name: render chunk ${{ matrix.chunk.i }} (frames ${{ matrix.chunk.from }}-${{ matrix.chunk.to }})
        working-directory: video
        run: |
          mkdir -p out
          ok=0
          for try in 1 2 3; do
            conc=$((4 - try))
            [ $conc -lt 1 ] && conc=1
            if npx remotion render Long out/c$(printf '%03d' ${{ matrix.chunk.i }}).mp4 --frames=${{ matrix.chunk.from }}-${{ matrix.chunk.to }} --muted --gl=angle --concurrency=$conc --crf=20 --log=error --timeout=900000; then ok=1; break; fi
            echo "retry $try"
          done
          [ "$ok" = 1 ]
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.i }}
          path: video/out/c*.mp4
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
  assemble:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        working-directory: video
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: video/out/chunks
          merge-multiple: true
      - name: join + sound
        working-directory: video
        run: |
          chmod +x node_modules/@remotion/compositor-linux-x64-gnu/* || true
          cd out/chunks && ls c*.mp4 | sort | sed "s/.*/file '&'/" > list.txt && cat list.txt | wc -l && cd ../..
          FF=$(ls node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg)
          $FF -hide_banner -v error -y -f concat -safe 0 -i out/chunks/list.txt -c copy out/silent.mp4
          node tools/mix-audio.mjs src/story/timeline.json public/sfx/bed.m4a 1 out/mix.wav
          node tools/loudness.mjs out/mix.wav out/silent.mp4 out/Long.mp4 -16
          ls -la out/Long.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Long-final
          path: video/out/Long.mp4
          retention-days: 14
          compression-level: 0
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=halcyon-star-${{ github.run_number }}
          gh release create "$TAG" video/out/Long.mp4 --title "Halcyon Star render #${{ github.run_number }}" --notes "Rendered by GitHub Actions" --target "$GITHUB_SHA"
