name: assemble-insult
on:
  push:
    branches: [ccr-351fd772-qnzg8e]
    paths: [assemble_request.txt]
permissions:
  contents: write
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: echo "run=$(head -1 assemble_request.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: dl
          merge-multiple: true
          run-id: ${{ steps.r.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: encode + commit
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p renders
          ls dl/videos/insult/frames | wc -l
          cat dl/render_*.log | grep -E " ok |FAILED" > renders/render_log.txt || true
          python3 - <<'PY'
          import os
          have={int(f[:4]) for f in os.listdir('dl/videos/insult/frames')}
          mx=max(have); miss=[i for i in range(1,mx+1) if i not in have]
          open('renders/missing.txt','w').write(f"max {mx}\nmissing {len(miss)}: {miss[:200]}\n")
          print(open('renders/missing.txt').read())
          PY
          ffmpeg -v error -y -framerate 30 -i dl/videos/insult/frames/%04d.png -c:v libx264 -preset slow -crf 13 -pix_fmt yuv444p renders/insult_frames.mkv
          ls -la renders
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add renders
          git commit -m "Rendered frames for insult story (540x960)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
